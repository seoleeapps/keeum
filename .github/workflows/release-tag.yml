name: Release Tag
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: '태그를 붙일 브랜치 또는 exact SHA'
        required: true
        default: main
        type: string
      tag:
        description: '첫 출시는 v1.0.0, 이후 비우면 bump 사용'
        required: false
        default: ''
        type: string
      bump:
        description: 'tag를 비웠을 때 증가 단위'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: '계산만 하고 태그와 번호 원장을 변경하지 않음'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  tag:
    uses: seorilabs/.github/.github/workflows/release-tag.yml@main
    with:
      target_ref: ${{ inputs.target_ref }}
      tag: ${{ inputs.tag }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
